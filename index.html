<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tax &amp; Revenue Share Obligations — Bigfoot Bites</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F4F1;
    --ink: #1C2321;
    --ink-soft: #52605B;
    --rule: #D7D9D3;
    --ledger-green: #2F6F5E;
    --ledger-green-soft: #E4EEEA;
    --revenue-amber: #B3752E;
    --revenue-amber-soft: #F3E9DA;
    --danger: #B3492D;
    --danger-soft: #F5E4DE;
    --inactive: #9A8F7D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 5rem;
  }

  header {
    margin-bottom: 2rem;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 1rem;
  }

  h1 {
    font-family: 'Roboto Slab', serif;
    font-weight: 700;
    font-size: 1.6rem;
    margin: 0 0 0.25rem;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .panel {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 6px;
    margin-bottom: 1.5rem;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.9rem 1.1rem;
    border-bottom: 1px solid var(--rule);
  }

  .panel-header h2 {
    font-family: 'Roboto Slab', serif;
    font-size: 1rem;
    margin: 0;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    border-radius: 4px;
    border: 1px solid transparent;
    padding: 0.45rem 0.85rem;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:hover { opacity: 0.85; }
  button:focus-visible {
    outline: 2px solid var(--ledger-green);
    outline-offset: 2px;
  }

  .btn-primary { background: var(--ledger-green); color: #fff; }
  .btn-quiet { background: transparent; color: var(--ink-soft); border-color: var(--rule); }
  .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger-soft); }
  .btn-danger:hover { background: var(--danger-soft); }

  #add-form {
    display: none;
    padding: 1.1rem;
    gap: 0.75rem;
    grid-template-columns: 1.2fr 1fr 1fr 1.3fr 0.75fr 0.65fr auto;
    align-items: end;
  }
  #add-form.open { display: grid; }

  label {
    display: block;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin-bottom: 0.3rem;
  }

  input, select {
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    padding: 0.5rem 0.55rem;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus {
    outline: 2px solid var(--ledger-green);
    outline-offset: 1px;
  }

  .rate-input { font-family: 'IBM Plex Mono', monospace; text-align: right; }

  .checkbox-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding-bottom: 0.55rem;
  }
  .checkbox-row input { width: auto; }

  table { width: 100%; border-collapse: collapse; }

  thead th {
    text-align: left;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--rule);
  }
  thead th.num { text-align: right; }

  tbody td {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--rule);
    font-size: 0.92rem;
    vertical-align: middle;
  }

  tbody tr.location-start td { border-top: 2px solid var(--ink); }

  td.location { font-weight: 600; }

  .type-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
  }
  .type-tag::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ledger-green);
  }
  .type-tag.revenue_share::before { background: var(--revenue-amber); }

  td.rate {
    font-family: 'IBM Plex Mono', monospace;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  td.active-cell { text-align: center; }
  .pill {
    display: inline-block;
    font-size: 0.72rem;
    padding: 0.15rem 0.5rem;
    border-radius: 20px;
  }
  .pill.on { background: var(--ledger-green-soft); color: var(--ledger-green); }
  .pill.off { background: #F0EEE9; color: var(--inactive); }

  td.actions { text-align: right; white-space: nowrap; }
  td.actions button { margin-left: 0.4rem; }

  tr.editing td { background: var(--ledger-green-soft); }
  tr.editing input, tr.editing select { background: #fff; }

  tr.location-subtotal td {
    background: var(--ledger-green-soft);
    color: var(--ledger-green);
    font-weight: 600;
    border-bottom: 2px solid var(--ink);
    padding-top: 0.5rem;
    padding-bottom: 0.5rem;
  }

  .empty-state {
    padding: 3rem 1rem;
    text-align: center;
    color: var(--ink-soft);
  }
  .empty-state strong { display: block; color: var(--ink); margin-bottom: 0.35rem; font-family: 'Roboto Slab', serif; }

  #status-line {
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin-top: 0.75rem;
    min-height: 1.2em;
  }
  #status-line.error { color: var(--danger); }

  @media (max-width: 720px) {
    #add-form.open { grid-template-columns: 1fr 1fr; }
    thead { display: none; }
    tbody tr { display: block; border-bottom: 2px solid var(--rule); }
    tbody td { display: flex; justify-content: space-between; border-bottom: none; padding: 0.5rem 1rem; }
    tbody td::before { content: attr(data-label); font-size: 0.72rem; text-transform: uppercase; color: var(--ink-soft); }
    td.actions { justify-content: flex-end; }
    td.actions::before { content: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tax &amp; Revenue Share Obligations</h1>
  </header>

  <section class="panel">
    <div class="panel-header">
      <h2>Obligations</h2>
      <button class="btn-primary" id="toggle-add">+ Add obligation</button>
    </div>

    <form id="add-form">
      <div>
        <label for="add-location">Location</label>
        <select id="add-location" required>
          <option value="Livano">Livano</option>
          <option value="Endeavor Elementary">Endeavor Elementary</option>
          <option value="Spry Funeral Home">Spry Funeral Home</option>
          <option value="Walden">Walden</option>
          <option value="Ashley Green">Ashley Green</option>
        </select>
      </div>
      <div>
        <label for="add-type">Type</label>
        <select id="add-type" required>
          <option value="state_tax">State tax</option>
          <option value="county_tax">County tax</option>
          <option value="city_tax">City tax</option>
          <option value="revenue_share">Revenue share</option>
        </select>
      </div>
      <div>
        <label for="add-filing">Filing frequency</label>
        <select id="add-filing">
          <option value="">Not set</option>
          <option value="monthly">Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="annual">Annual</option>
        </select>
      </div>
      <div>
        <label for="add-payee">Payee</label>
        <input id="add-payee" type="text" placeholder="Alabama DOR" required>
      </div>
      <div>
        <label for="add-rate">Rate (%)</label>
        <input id="add-rate" class="rate-input" type="number" step="0.01" min="0" max="100" placeholder="3.00" required>
      </div>
      <div class="checkbox-row">
        <input id="add-active" type="checkbox" checked>
        <label for="add-active" style="margin-bottom:0;text-transform:none;letter-spacing:0;font-size:0.85rem;">Active</label>
      </div>
      <div>
        <button type="submit" class="btn-primary">Save</button>
        <button type="button" class="btn-quiet" id="cancel-add">Cancel</button>
      </div>
    </form>

    <table id="obligations-table" style="display:none;">
      <thead>
        <tr>
          <th>Location</th>
          <th>Type</th>
          <th>Filing</th>
          <th>Payee</th>
          <th class="num">Rate</th>
          <th style="text-align:center;">Active</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="obligations-body"></tbody>
    </table>

    <div class="empty-state" id="empty-state" style="display:none;">
      <strong>No obligations yet</strong>
      Add the first one above — every location needs at least a state tax row to show up in the weekly report.
    </div>
  </section>

  <div id="status-line"></div>
</main>

<script>
  // Set this to your n8n Cloud instance's webhook base URL once
  // "Tax Obligations — CRUD API" is pasted in and activated.
  // Production webhooks use /webhook/, test-mode runs use /webhook-test/.
  // Single endpoint for everything: GET to read, POST with an
  // `operation` field ('create' | 'update' | 'delete') for all writes.
  const API_BASE = 'https://randysmith42.app.n8n.cloud/webhook/tax-obligations';
  const API_KEY = 'tMEUHYnK8aCNccKZ5Zp#oMBazyR3deGM';

  const TYPE_LABELS = {
    state_tax: 'State tax',
    county_tax: 'County tax',
    city_tax: 'City tax',
    revenue_share: 'Revenue share'
  };

  const FILING_LABELS = {
    monthly: 'Monthly',
    quarterly: 'Quarterly',
    annual: 'Annual'
  };

  let obligations = [];
  let editingId = null;

  const tableEl = document.getElementById('obligations-table');
  const bodyEl = document.getElementById('obligations-body');
  const emptyEl = document.getElementById('empty-state');
  const statusEl = document.getElementById('status-line');

  function setStatus(message, isError) {
    statusEl.textContent = message || '';
    statusEl.className = isError ? 'error' : '';
  }

  async function loadObligations() {
    setStatus('Loading…');
    try {
      const res = await fetch(API_BASE, { method: 'GET', headers: { 'X-API-Key': API_KEY } });
      if (!res.ok) throw new Error('Server returned ' + res.status);
      obligations = await res.json();
      render();
      setStatus('');
    } catch (err) {
      setStatus('Could not load obligations — ' + err.message, true);
    }
  }

  async function writeObligation(payload) {
    const res = await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': API_KEY },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('Server returned ' + res.status);
    return res.json();
  }

  function render() {
    if (!obligations.length) {
      tableEl.style.display = 'none';
      emptyEl.style.display = 'block';
      return;
    }
    tableEl.style.display = 'table';
    emptyEl.style.display = 'none';
    bodyEl.innerHTML = '';

    let lastLocation = null;
    let activeTotal = 0;

    obligations.forEach((row, index) => {
      const tr = document.createElement('tr');
      if (row.location !== lastLocation) {
        if (lastLocation !== null) bodyEl.appendChild(subtotalRow(lastLocation, activeTotal));
        tr.classList.add('location-start');
        lastLocation = row.location;
        activeTotal = 0;
      }
      if (row.active) activeTotal += parseFloat(row.rate);

      if (editingId === row.id) {
        tr.classList.add('editing');
        tr.appendChild(editableCell('location', row, 'select', [
          'Livano', 'Endeavor Elementary', 'Spry Funeral Home', 'Walden', 'Ashley Green'
        ]));
        tr.appendChild(editableCell('obligation_type', row, 'select', Object.keys(TYPE_LABELS)));
        tr.appendChild(editableFilingCell(row));
        tr.appendChild(editableCell('payee', row, 'text'));
        tr.appendChild(editableCell('rate', row, 'rate'));
        tr.appendChild(editableActiveCell(row));
        tr.appendChild(editActionsCell(row));
      } else {
        tr.appendChild(td('Location', row.location, 'location'));
        const typeTd = td('Type', '', '');
        const span = document.createElement('span');
        span.className = 'type-tag ' + row.obligation_type;
        span.textContent = TYPE_LABELS[row.obligation_type] || row.obligation_type;
        typeTd.appendChild(span);
        tr.appendChild(typeTd);
        const filingTd = td('Filing', row.filing_frequency ? FILING_LABELS[row.filing_frequency] : '—', '');
        tr.appendChild(filingTd);
        tr.appendChild(td('Payee', row.payee, ''));
        tr.appendChild(td('Rate', (parseFloat(row.rate) * 100).toFixed(2) + '%', 'rate'));
        const activeTd = td('Active', '', 'active-cell');
        const pill = document.createElement('span');
        pill.className = 'pill ' + (row.active ? 'on' : 'off');
        pill.textContent = row.active ? 'Active' : 'Inactive';
        activeTd.appendChild(pill);
        tr.appendChild(activeTd);
        tr.appendChild(viewActionsCell(row));
      }

      bodyEl.appendChild(tr);

      if (index === obligations.length - 1) bodyEl.appendChild(subtotalRow(row.location, activeTotal));
    });
  }

  function editableFilingCell(row) {
    const cell = document.createElement('td');
    cell.dataset.label = 'Filing';
    const select = document.createElement('select');
    select.id = 'edit-filing_frequency-' + row.id;
    const options = [['', 'Not set'], ['monthly', 'Monthly'], ['quarterly', 'Quarterly'], ['annual', 'Annual']];
    for (const [value, label] of options) {
      const o = document.createElement('option');
      o.value = value;
      o.textContent = label;
      if ((row.filing_frequency || '') === value) o.selected = true;
      select.appendChild(o);
    }
    cell.appendChild(select);
    return cell;
  }

  function subtotalRow(location, activeTotal) {
    const tr = document.createElement('tr');
    tr.className = 'location-subtotal';

    const labelTd = document.createElement('td');
    labelTd.colSpan = 4;
    labelTd.dataset.label = '';
    labelTd.innerHTML = '<strong>' + location + ' — total owed out (active only)</strong>';

    const rateTd = document.createElement('td');
    rateTd.className = 'rate';
    rateTd.dataset.label = 'Total';
    rateTd.innerHTML = '<strong>' + (activeTotal * 100).toFixed(2) + '%</strong>';

    tr.appendChild(labelTd);
    tr.appendChild(rateTd);
    tr.appendChild(document.createElement('td'));
    tr.appendChild(document.createElement('td'));
    return tr;
  }

  function td(label, text, cls) {
    const cell = document.createElement('td');
    cell.dataset.label = label;
    if (cls) cell.className = cls;
    cell.textContent = text;
    return cell;
  }

  function editableCell(field, row, kind, options) {
    const cell = document.createElement('td');
    cell.dataset.label = field;
    let input;
    if (kind === 'select') {
      input = document.createElement('select');
      for (const opt of options) {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = field === 'obligation_type' ? TYPE_LABELS[opt] : opt;
        if (opt === row[field]) o.selected = true;
        input.appendChild(o);
      }
    } else if (kind === 'rate') {
      input = document.createElement('input');
      input.type = 'number';
      input.step = '0.01';
      input.min = '0';
      input.max = '100';
      input.className = 'rate-input';
      input.value = (parseFloat(row.rate) * 100).toFixed(2);
    } else {
      input = document.createElement('input');
      input.type = 'text';
      input.value = row[field];
    }
    input.id = 'edit-' + field + '-' + row.id;
    cell.appendChild(input);
    return cell;
  }

  function editableActiveCell(row) {
    const cell = document.createElement('td');
    cell.dataset.label = 'Active';
    cell.className = 'active-cell';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.id = 'edit-active-' + row.id;
    input.checked = row.active;
    cell.appendChild(input);
    return cell;
  }

  function viewActionsCell(row) {
    const cell = document.createElement('td');
    cell.className = 'actions';
    const editBtn = document.createElement('button');
    editBtn.className = 'btn-quiet';
    editBtn.textContent = 'Edit';
    editBtn.onclick = () => { editingId = row.id; render(); };
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-danger';
    delBtn.textContent = 'Delete';
    delBtn.onclick = () => deleteObligation(row);
    cell.appendChild(editBtn);
    cell.appendChild(delBtn);
    return cell;
  }

  function editActionsCell(row) {
    const cell = document.createElement('td');
    cell.className = 'actions';
    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn-primary';
    saveBtn.textContent = 'Save';
    saveBtn.onclick = () => saveEdit(row);
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn-quiet';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.onclick = () => { editingId = null; render(); };
    cell.appendChild(saveBtn);
    cell.appendChild(cancelBtn);
    return cell;
  }

  async function saveEdit(row) {
    const payload = {
      operation: 'update',
      id: row.id,
      location: document.getElementById('edit-location-' + row.id).value,
      obligation_type: document.getElementById('edit-obligation_type-' + row.id).value,
      filing_frequency: document.getElementById('edit-filing_frequency-' + row.id).value || null,
      payee: document.getElementById('edit-payee-' + row.id).value,
      rate: parseFloat(document.getElementById('edit-rate-' + row.id).value) / 100,
      active: document.getElementById('edit-active-' + row.id).checked
    };
    setStatus('Saving…');
    try {
      await writeObligation(payload);
      editingId = null;
      await loadObligations();
      setStatus('Saved.');
    } catch (err) {
      setStatus('Could not save — ' + err.message, true);
    }
  }

  async function deleteObligation(row) {
    const label = row.payee + ' (' + (TYPE_LABELS[row.obligation_type] || row.obligation_type) + ', ' + row.location + ')';
    if (!confirm('Delete ' + label + '? This can\'t be undone.')) return;
    setStatus('Deleting…');
    try {
      await writeObligation({ operation: 'delete', id: row.id });
      await loadObligations();
      setStatus('Deleted.');
    } catch (err) {
      setStatus('Could not delete — ' + err.message, true);
    }
  }

  const addForm = document.getElementById('add-form');
  document.getElementById('toggle-add').onclick = () => addForm.classList.add('open');
  document.getElementById('cancel-add').onclick = () => { addForm.classList.remove('open'); addForm.reset(); };

  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      operation: 'create',
      location: document.getElementById('add-location').value,
      obligation_type: document.getElementById('add-type').value,
      filing_frequency: document.getElementById('add-filing').value || null,
      payee: document.getElementById('add-payee').value,
      rate: parseFloat(document.getElementById('add-rate').value) / 100,
      active: document.getElementById('add-active').checked
    };
    setStatus('Saving…');
    try {
      await writeObligation(payload);
      addForm.reset();
      addForm.classList.remove('open');
      await loadObligations();
      setStatus('Added.');
    } catch (err) {
      setStatus('Could not add — ' + err.message, true);
    }
  });

  loadObligations();
</script>
</body>
</html>
